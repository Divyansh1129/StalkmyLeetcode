<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>StalkmyLeetcode.log</title>

<link rel="icon" href="/podium.png?v=2" type="image/png">

<style>
:root{color-scheme:light;--ink:#182622;--muted:#718079;--paper:#f4f3ed;--panel:#fffefa;--line:#e3e5dc;--green:#c8f169;--deep:#173b31;--easy:#078a70;--medium:#b78316;--hard:#d44e42}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:30px clamp(16px,4vw,56px) 60px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(24px,5vw,58px);margin-bottom:26px;border-radius:28px;background:var(--deep);color:white;position:relative;overflow:hidden;box-shadow:0 18px 40px #173b311c}header:after{content:"";position:absolute;width:340px;height:340px;right:13%;top:-230px;border:1px solid #ffffff22;border-radius:50%;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff06;pointer-events:none}h1{font-size:clamp(29px,5vw,54px);line-height:1.03;letter-spacing:-.055em;margin:0;max-width:680px}h1 span{color:var(--green)}.actions{display:flex;align-items:center;gap:16px;z-index:1}.live{font-size:12px;color:#cad8d0;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #c8f16922;animation:p 1.5s infinite}@keyframes p{50%{opacity:.5;transform:scale(.8)}}.refresh{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 17px;border:0;border-radius:999px;background:var(--green);color:var(--deep);font-weight:800;cursor:pointer;transition:.2s}.refresh:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0003}.refresh:disabled{opacity:.65;cursor:wait}.refresh.spinning .refresh-icon{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.section-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);margin:0 0 10px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.chip{background:transparent;border:1px solid #d8ddd3;color:#4c5a53;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;transition:.16s}.chip:hover{border-color:var(--deep);color:var(--deep)}.chip.on{background:var(--deep);color:white;border-color:var(--deep)}#sorts{margin-bottom:20px}.controls{display:flex;align-items:center;gap:9px;padding:14px;margin-bottom:24px;background:#e9eae1;border-radius:18px}.controls select,.controls input{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:11px;font-size:13px;outline:none}.controls input{min-width:210px}.controls select:focus,.controls input:focus{border-color:#71934b;box-shadow:0 0 0 3px #c8f16955}.controls .spacer{flex:1}.controls .add{background:var(--deep);color:white;border-color:var(--deep);padding-inline:17px}.err{color:var(--hard);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}.board-wrap{min-width:0}.board-head{display:flex;justify-content:space-between;align-items:end;margin:0 3px 12px}.board-head h2{font-size:20px;letter-spacing:-.04em;margin:0}.board-head p{margin:0;color:var(--muted);font-size:12px}#board{position:relative;min-height:120px}.row{position:absolute;left:0;right:0;height:66px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:14px;padding:0 16px;box-shadow:0 4px 14px #1c35240a;transition:transform .6s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s}.row:hover{border-color:#9eb47c;box-shadow:0 10px 24px #1c352414}.row.flash{animation:fl 1.2s}@keyframes fl{0%{background:#edfad5}100%{background:var(--panel)}}.rk{width:30px;text-align:center;font-weight:850;font-size:14px;color:#7a8980}.r1{color:#b87918}.r2{color:#84928c}.r3{color:#ae7049}.av{width:40px;height:40px;border-radius:14px;background:#e4e7de;object-fit:cover}.nm{flex:1;min-width:0}.nm a{color:var(--ink);text-decoration:none;font-weight:800}.nm a:hover{color:#467347}.nm small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st{display:flex;gap:9px;font-size:12px;font-weight:750}.e{color:var(--easy)}.m{color:var(--medium)}.h{color:var(--hard)}.big{min-width:78px;text-align:right;font-size:21px;line-height:1;font-weight:850;color:var(--deep);font-variant-numeric:tabular-nums}.big small{display:block;margin-top:5px;font-size:9px;line-height:1.1;color:var(--muted);font-weight:700}.x{background:transparent;border:0;color:#9aa49d;cursor:pointer;font-size:17px;padding:5px}.x:hover{color:var(--hard)}.feed{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-height:660px;overflow:auto;box-shadow:0 8px 22px #1c35240a}.feed h3{margin:0 0 3px;font-size:18px;letter-spacing:-.04em}.feed .sub{font-size:11px;color:var(--muted);margin:0 0 14px}.it{padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.it b{color:#49744e}.ok{color:var(--easy)}.bad{color:var(--hard)}.it small{color:var(--muted);display:block;margin-top:4px}.it a{color:var(--ink)!important;text-decoration:none;font-weight:650}.it a:hover{text-decoration:underline}.empty{padding:30px 18px;text-align:center;background:var(--panel);border:1px dashed #cbd2c7;border-radius:18px;color:var(--muted)}
@media(max-width:980px){.grid{grid-template-columns:1fr}.feed{position:static;max-height:480px}.feed #feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}}@media(max-width:650px){.wrap{padding:14px 12px 36px}header{align-items:flex-start;flex-direction:column;padding:24px;border-radius:22px}.actions{width:100%;justify-content:space-between}.controls{flex-wrap:wrap;padding:11px}.controls select{flex:1;min-width:150px}.controls .spacer{display:none}.controls input{flex:1;min-width:150px}.controls .add{flex:0 0 auto}.st{display:none}.row{gap:9px;padding:0 10px}.rk{width:20px}.av{width:35px;height:35px;border-radius:12px}.big{min-width:54px;font-size:18px}.big small{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.feed #feed{display:block}.board-head p{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<body>

<div class="wrap">

<header><h1>LeetCode <span>arena.</span></h1><div class="actions"><div class="live"><span class="dot"></span><span id="upd">connecting…</span></div><button class="refresh" id="refresh" type="button" title="Fetch the latest data now"><span class="refresh-icon" aria-hidden="true">↻</span> Refresh</button></div></header>
<p class="section-label">Leaderboard view</p><div class="bar" id="sorts"></div>
<div class="controls"><select id="topic"><option value="">Rank by topic…</option></select><span class="spacer"></span><input id="nu" placeholder="Add a LeetCode username" aria-label="LeetCode username"><button class="chip add" id="add">Add player +</button><span class="err" id="msg" role="status"></span></div>
<div class="grid"><section class="board-wrap" aria-label="Leaderboard"><div class="board-head"><h2>Standings</h2><p>Ranked by <span id="rank-label">Total solved</span></p></div><div id="board"></div></section><aside class="feed"><h3>Activity stream</h3><p class="sub">Latest submissions from your players</p><div id="feed"></div></aside></div></div>

<script>

const SORTS = {
    total:['Total solved',u=>u.total],
    easy:['Easy',u=>u.easy],
    medium:['Medium',u=>u.medium],
    hard:['Hard',u=>u.hard],
    rating:['Contest rating',u=>u.rating],
    today:['Submissions today',u=>u.today],
    week:['Last 7 days',u=>u.week],
    month:['Last 30 days',u=>u.month]
};

let D = [];
let sort = 'total';
let topic = '';
let rows = {};
let prev = {};
let ROW = 74;

const $ = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g,
    c => '&#'+c.charCodeAt(0)+';'
);

$('#sorts').innerHTML = Object.entries(SORTS)
.map(([k,v]) =>
    `<button class="chip${k==sort?' on':''}" data-k="${k}">${v[0]}</button>`
).join('');

$('#sorts').onclick = e => {

    const k = e.target.dataset.k;

    if(!k) return;

    sort = k;
    topic = '';

    $('#topic').value = '';

    document.querySelectorAll('#sorts .chip')
    .forEach(c => c.classList.toggle('on',c.dataset.k==k));

    render();
};

$('#topic').onchange = e => {

    topic = e.target.value;

    document.querySelectorAll('#sorts .chip')
    .forEach(c => c.classList.toggle('on',!topic && c.dataset.k==sort));

    render();
};

const metric = u =>
    topic ? (u.tags[topic]||0) : SORTS[sort][1](u);

const label = () =>
    topic ? topic : SORTS[sort][0];

function ago(t) {

    const s = Math.max(0,Date.now()/1000-t);

    return s<60 ? 'just now' :
           s<3600 ? Math.floor(s/60)+'m ago' :
           s<86400 ? Math.floor(s/3600)+'h ago' :
           Math.floor(s/86400)+'d ago';
}

function render() {

    $('#rank-label').textContent = label();

    const list = [...D].sort(
        (a,b) => metric(b)-metric(a) || b.total-a.total
    );

    const board = $('#board');

    board.style.height = list.length ? (list.length*ROW-8)+'px' : 'auto';
    if (!list.length) board.innerHTML = '<div class="empty">No players loaded yet. Add a username to get started.</div>';
    else if (board.querySelector('.empty')) board.innerHTML = '';

    const seen = new Set();

    list.forEach((u,i) => {

        const id = u.username.toLowerCase();

        seen.add(id);

        let el = rows[id];

        if(!el) {

            el = rows[id] = document.createElement('div');

            el.className = 'row';

            board.appendChild(el);
        }

        el.style.transform = `translateY(${i*ROW}px)`;

        const sig = u.total+'/'+u.rating+'/'+u.week;

        if(prev[id] && prev[id]!==sig) {

            el.classList.remove('flash');

            void el.offsetWidth;

            el.classList.add('flash');
        }

        prev[id] = sig;

        el.innerHTML = `
            <div class="rk r${i+1}">${i+1}</div>

            <img class="av"
            src="${esc(u.avatar||'')}"
            onerror="this.style.visibility='hidden'">

            <div class="nm">

                <a href="https://leetcode.com/u/${encodeURIComponent(u.username)}/"
                target="_blank">${esc(u.name)}</a>

                <small>
                    @${esc(u.username)} · ${u.total} solved ·
                    rating ${u.rating||'—'}
                    ${u.error ? `<span class="err">⚠ ${esc(u.error)}</span>` : ''}
                </small>

            </div>

            <div class="st">
                <span class="e">E ${u.easy}</span>
                <span class="m">M ${u.medium}</span>
                <span class="h">H ${u.hard}</span>
            </div>

            <div class="big">
                ${metric(u)}
                <small>${esc(label())}</small>
            </div>

            <button class="x" title="Remove"
            data-u="${esc(u.username)}">✕</button>
        `;
    });

    Object.keys(rows).forEach(id => {

        if(!seen.has(id)) {

            rows[id].remove();

            delete rows[id];
        }
    });

    const tags = [
        ...new Set(D.flatMap(u=>Object.keys(u.tags)))
    ].sort();

    const sel = $('#topic');

    if(sel.options.length-1 !== tags.length) {

        sel.innerHTML =
            '<option value="">🎯 Rank by topic…</option>' +
            tags.map(t=>`<option>${esc(t)}</option>`).join('');

        sel.value = topic;
    }

    const feed = D.flatMap(u =>
        u.recent.map(r=>({...r,who:u.name}))
    )
    .sort((a,b)=>b.timestamp-a.timestamp)
    .slice(0,25);

    $('#feed').innerHTML = feed.map(r => `
        <div class="it">

            <b>${esc(r.who)}</b>

            <span class="${r.statusDisplay=='Accepted'?'ok':'bad'}">
                ${esc(r.statusDisplay)}
            </span>

            <br>

            <a style="color:var(--tx)"
            href="https://leetcode.com/problems/${esc(r.titleSlug)}/"
            target="_blank">${esc(r.title)}</a>

            <small>
                ${esc(r.lang)} · ${ago(r.timestamp)}
            </small>

        </div>
    `).join('') || '<small>No data yet…</small>';
}

$('#board').onclick = async e => {

    const u = e.target.dataset.u;

    if(u && confirm('Remove '+u+'?')) {

        await fetch('/api/users/'+encodeURIComponent(u), {
            method:'DELETE'
        });

        load();
    }
};

$('#add').onclick = async () => {

    const v = $('#nu').value.trim();

    if(!v) return;

    $('#msg').textContent = 'Checking…';

    const r = await fetch('/api/users', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            username:v
        })

    });

    const j = await r.json();

    $('#msg').textContent = j.error||'';

    if(!j.error) {
        $('#nu').value = '';
    }

    load();
};

$('#nu').onkeydown = e => {

    if(e.key==='Enter') {
        $('#add').click();
    }
};

let last = 0;

async function load(manual = false) {

    const button = $('#refresh');
    if (manual) {
        button.disabled = true;
        button.classList.add('spinning');
        button.setAttribute('aria-busy', 'true');
        $('#upd').textContent = 'Refreshing…';
    }

    try {

        const response = await fetch(manual ? '/api/data?refresh=1' : '/api/data');
        if (!response.ok) throw new Error('Could not load leaderboard');
        D = await response.json();

        last = Date.now();

        render();

    } catch(e) {

        console.error(e);
        $('#upd').textContent = 'Could not refresh · try again';
    } finally {
        if (manual) {
            button.disabled = false;
            button.classList.remove('spinning');
            button.removeAttribute('aria-busy');
        }
    }
}

$('#refresh').onclick = () => load(true);

setInterval(() => {

    if(last) {

        $('#upd').textContent =
            'Live · updated '+Math.round((Date.now()-last)/1000)+'s ago';
    }

},1000);

load();

setInterval(load,5000);

</script>

</body>
</html>
