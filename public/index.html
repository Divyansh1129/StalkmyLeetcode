<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>StalkmyLeetcode.log</title>

<link rel="icon" href="/podium.png?v=2" type="image/png">

<style>
:root {
    --bg:#0d1117;
    --card:#161b22;
    --line:#262d38;
    --tx:#e6edf3;
    --mu:#8b949e;
    --ac:#ffa116;
    --e:#00b8a3;
    --m:#ffc01e;
    --h:#ef4743;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--tx);
    font:15px system-ui,sans-serif;
    padding:20px;
}

.wrap {
    max-width:1200px;
    margin:auto;
}

header {
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

h1 {
    margin:0;
    font-size:24px;
}

h1 span {
    color:var(--ac);
}

.live {
    font-size:13px;
    color:var(--mu);
    display:flex;
    align-items:center;
    gap:8px;
}

.dot {
    width:9px;
    height:9px;
    border-radius:50%;
    background:#3fb950;
    animation:p 1.4s infinite;
}

@keyframes p {
    50% {
        opacity:.3;
        transform:scale(1.5);
    }
}

.bar {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
    align-items:center;
}

.chip {
    background:var(--card);
    border:1px solid var(--line);
    color:var(--tx);
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
    transition:.15s;
}

.chip:hover {
    border-color:var(--ac);
}

.chip.on {
    background:var(--ac);
    color:#000;
    border-color:var(--ac);
    font-weight:600;
}

select,input {
    background:var(--card);
    border:1px solid var(--line);
    color:var(--tx);
    padding:7px 12px;
    border-radius:8px;
    font-size:13px;
}

.grid {
    display:grid;
    grid-template-columns:1fr 340px;
    gap:16px;
}

@media(max-width:900px) {
    .grid {
        grid-template-columns:1fr;
    }
}

#board {
    position:relative;
}

.row {
    position:absolute;
    left:0;
    right:0;
    height:60px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 14px;
    transition:transform .6s cubic-bezier(.2,.8,.2,1),border-color .2s;
}

.row:hover {
    border-color:var(--ac);
}

.row.flash {
    animation:fl 1.2s;
}

@keyframes fl {
    0% {
        background:#3a2c0b;
    }
    100% {
        background:var(--card);
    }
}

.rk {
    width:30px;
    text-align:center;
    font-weight:800;
    font-size:18px;
}

.r1 { color:#ffd700; }
.r2 { color:#c0c0c0; }
.r3 { color:#cd7f32; }

.av {
    width:38px;
    height:38px;
    border-radius:50%;
    background:#333;
    object-fit:cover;
}

.nm {
    flex:1;
    min-width:0;
}

.nm a {
    color:var(--tx);
    text-decoration:none;
    font-weight:600;
}

.nm a:hover {
    color:var(--ac);
}

.nm small {
    display:block;
    color:var(--mu);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.st {
    display:flex;
    gap:10px;
    font-size:13px;
    font-weight:600;
}

.e { color:var(--e); }
.m { color:var(--m); }
.h { color:var(--h); }

.big {
    min-width:70px;
    text-align:right;
    font-size:20px;
    font-weight:800;
    color:var(--ac);
}

.big small {
    display:block;
    font-size:10px;
    color:var(--mu);
    font-weight:400;
}

.x {
    background:none;
    border:0;
    color:var(--mu);
    cursor:pointer;
    font-size:18px;
}

.x:hover {
    color:var(--h);
}

.err {
    color:var(--h);
    font-size:11px;
}

.feed {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    max-height:640px;
    overflow:auto;
}

.feed h3 {
    margin:0 0 10px;
    font-size:15px;
}

.it {
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
}

.it b {
    color:var(--ac);
}

.ok { color:var(--e); }
.bad { color:var(--h); }

.it small {
    color:var(--mu);
    display:block;
}

@media(max-width:600px) {
    .st {
        display:none;
    }
}
</style>
</head>

<body>

<div class="wrap">

<header>
    <h1>🏆 LeetCode <span>Live</span> Leaderboard</h1>

    <div class="live">
        <span class="dot"></span>
        <span id="upd">connecting…</span>
    </div>
</header>

<div class="bar" id="sorts"></div>

<div class="bar">

    <select id="topic">
        <option value="">🎯 Rank by topic…</option>
    </select>

    <span style="flex:1"></span>

    <input id="nu" placeholder="LeetCode username">

    <button class="chip on" id="add">+ Add</button>

    <span class="err" id="msg"></span>

</div>

<div class="grid">

    <div id="board"></div>

    <div class="feed">
        <h3>⚡ Recent submissions</h3>
        <div id="feed"></div>
    </div>

</div>
</div>

<script>

const SORTS = {
    total:['Total solved',u=>u.total],
    easy:['Easy',u=>u.easy],
    medium:['Medium',u=>u.medium],
    hard:['Hard',u=>u.hard],
    rating:['Contest rating',u=>u.rating],
    today:['Submissions today',u=>u.today],
    week:['Last 7 days',u=>u.week],
    month:['Last 30 days',u=>u.month]
};

let D = [];
let sort = 'total';
let topic = '';
let rows = {};
let prev = {};
let ROW = 68;

const $ = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g,
    c => '&#'+c.charCodeAt(0)+';'
);

$('#sorts').innerHTML = Object.entries(SORTS)
.map(([k,v]) =>
    `<button class="chip${k==sort?' on':''}" data-k="${k}">${v[0]}</button>`
).join('');

$('#sorts').onclick = e => {

    const k = e.target.dataset.k;

    if(!k) return;

    sort = k;
    topic = '';

    $('#topic').value = '';

    document.querySelectorAll('#sorts .chip')
    .forEach(c => c.classList.toggle('on',c.dataset.k==k));

    render();
};

$('#topic').onchange = e => {

    topic = e.target.value;

    document.querySelectorAll('#sorts .chip')
    .forEach(c => c.classList.toggle('on',!topic && c.dataset.k==sort));

    render();
};

const metric = u =>
    topic ? (u.tags[topic]||0) : SORTS[sort][1](u);

const label = () =>
    topic ? topic : SORTS[sort][0];

function ago(t) {

    const s = Math.max(0,Date.now()/1000-t);

    return s<60 ? 'just now' :
           s<3600 ? Math.floor(s/60)+'m ago' :
           s<86400 ? Math.floor(s/3600)+'h ago' :
           Math.floor(s/86400)+'d ago';
}

function render() {

    const list = [...D].sort(
        (a,b) => metric(b)-metric(a) || b.total-a.total
    );

    const board = $('#board');

    board.style.height = list.length*ROW+'px';

    const seen = new Set();

    list.forEach((u,i) => {

        const id = u.username.toLowerCase();

        seen.add(id);

        let el = rows[id];

        if(!el) {

            el = rows[id] = document.createElement('div');

            el.className = 'row';

            board.appendChild(el);
        }

        el.style.transform = `translateY(${i*ROW}px)`;

        const sig = u.total+'/'+u.rating+'/'+u.week;

        if(prev[id] && prev[id]!==sig) {

            el.classList.remove('flash');

            void el.offsetWidth;

            el.classList.add('flash');
        }

        prev[id] = sig;

        el.innerHTML = `
            <div class="rk r${i+1}">${i+1}</div>

            <img class="av"
            src="${esc(u.avatar||'')}"
            onerror="this.style.visibility='hidden'">

            <div class="nm">

                <a href="https://leetcode.com/u/${encodeURIComponent(u.username)}/"
                target="_blank">${esc(u.name)}</a>

                <small>
                    @${esc(u.username)} · ${u.total} solved ·
                    rating ${u.rating||'—'}
                    ${u.error ? `<span class="err">⚠ ${esc(u.error)}</span>` : ''}
                </small>

            </div>

            <div class="st">
                <span class="e">E ${u.easy}</span>
                <span class="m">M ${u.medium}</span>
                <span class="h">H ${u.hard}</span>
            </div>

            <div class="big">
                ${metric(u)}
                <small>${esc(label())}</small>
            </div>

            <button class="x" title="Remove"
            data-u="${esc(u.username)}">✕</button>
        `;
    });

    Object.keys(rows).forEach(id => {

        if(!seen.has(id)) {

            rows[id].remove();

            delete rows[id];
        }
    });

    const tags = [
        ...new Set(D.flatMap(u=>Object.keys(u.tags)))
    ].sort();

    const sel = $('#topic');

    if(sel.options.length-1 !== tags.length) {

        sel.innerHTML =
            '<option value="">🎯 Rank by topic…</option>' +
            tags.map(t=>`<option>${esc(t)}</option>`).join('');

        sel.value = topic;
    }

    const feed = D.flatMap(u =>
        u.recent.map(r=>({...r,who:u.name}))
    )
    .sort((a,b)=>b.timestamp-a.timestamp)
    .slice(0,25);

    $('#feed').innerHTML = feed.map(r => `
        <div class="it">

            <b>${esc(r.who)}</b>

            <span class="${r.statusDisplay=='Accepted'?'ok':'bad'}">
                ${esc(r.statusDisplay)}
            </span>

            <br>

            <a style="color:var(--tx)"
            href="https://leetcode.com/problems/${esc(r.titleSlug)}/"
            target="_blank">${esc(r.title)}</a>

            <small>
                ${esc(r.lang)} · ${ago(r.timestamp)}
            </small>

        </div>
    `).join('') || '<small>No data yet…</small>';
}

$('#board').onclick = async e => {

    const u = e.target.dataset.u;

    if(u && confirm('Remove '+u+'?')) {

        await fetch('/api/users/'+encodeURIComponent(u), {
            method:'DELETE'
        });

        load();
    }
};

$('#add').onclick = async () => {

    const v = $('#nu').value.trim();

    if(!v) return;

    $('#msg').textContent = 'Checking…';

    const r = await fetch('/api/users', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            username:v
        })

    });

    const j = await r.json();

    $('#msg').textContent = j.error||'';

    if(!j.error) {
        $('#nu').value = '';
    }

    load();
};

$('#nu').onkeydown = e => {

    if(e.key==='Enter') {
        $('#add').click();
    }
};

let last = 0;

async function load() {

    try {

        D = await (await fetch('/api/data')).json();

        last = Date.now();

        render();

    } catch(e) {

        console.error(e);
    }
}

setInterval(() => {

    if(last) {

        $('#upd').textContent =
            'Live · updated '+Math.round((Date.now()-last)/1000)+'s ago';
    }

},1000);

load();

setInterval(load,5000);

</script>

</body>
</html>
